name = "d1-connect"
main = "cloudflare/worker.js"
compatibility_date = "2024-05-11"

# Top-level non-secret environment variables for default deployment
vars = { ADMIN_EMAIL = "avik@avikb.dev", DEFAULT_TIMEZONE = "Asia/Kolkata", MAIL_API_URL = "https://api.resend.com/emails" }

# Top-level D1 binding so default (no env) worker has DB available
[[d1_databases]]
binding = "DB"
database_name = "portfolio-messages-db"
database_id = "a8f9ae11-d30f-4376-9d55-525f246032b6"

# The live feed for broadcasts (cloudflare/hub.js). One object that every open
# home page holds a WebSocket to. SQLite-backed, which the free plan requires.
[[durable_objects.bindings]]
name = "HUB"
class_name = "BroadcastHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BroadcastHub"]

# Per-IP limit on the private Binance view (cloudflare/binance.js), so guessing
# its link is slow as well as hopeless. namespace_id is any number unique to the account.
[[ratelimits]]
name = "BINANCE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Refreshes the saved Binance balances (binance.js) every 30 minutes, so the
# private page has something recent when Binance turns a visit away.
[triggers]
crons = ["*/30 * * * *"]

# Environment variables (non-secret). Put secrets via `wrangler secret put ...`.
[env.production]
vars = {ADMIN_EMAIL = "avik@avikb.dev", DEFAULT_TIMEZONE = "Asia/Kolkata", MAIL_API_URL = "https://api.resend.com/emails"}
[[env.production.d1_databases]]
binding = "DB"
database_name = "portfolio-messages-db"
database_id = "a8f9ae11-d30f-4376-9d55-525f246032b6"

[env.development]
vars = {ADMIN_EMAIL = "avik@avikb.dev", DEFAULT_TIMEZONE = "Asia/Kolkata", MAIL_API_URL = "https://api.resend.com/emails"}
[[env.development.d1_databases]]
binding = "DB"
database_name = "portfolio-messages-db"
database_id = "a8f9ae11-d30f-4376-9d55-525f246032b6"
