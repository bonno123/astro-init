name: Deploy to GitHub Pages

on:
  push:
    branches: [trunk]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

env:
  PUBLIC_CONTACT_EMAIL: ${{ vars.PUBLIC_CONTACT_EMAIL }}
  PUBLIC_API_ENDPOINT: ${{ vars.PUBLIC_API_ENDPOINT }}

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4

        # Use Yarn 4.3.0 to build your site
      - name: Enable Corepack and prepare Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.3.0 --activate

      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          path: .
          # Astro 7 needs Node 22.23.4 or newer. Keep in step with .nvmrc.
          node-version: 24
          package-manager: yarn@

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
