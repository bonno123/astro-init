name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches: [ trunk ]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

env:
  PUBLIC_SITE_NAME: ${{ vars.PUBLIC_SITE_NAME }}
  PUBLIC_CONTACT_EMAIL: ${{ vars.PUBLIC_CONTACT_EMAIL }}
  PUBLIC_CONTACT_PHONE: ${{ vars.PUBLIC_CONTACT_PHONE }}
  PUBLIC_BACKEND_SERVER_URL: ${{ vars.PUBLIC_BACKEND_SERVER_URL }}

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v3
        
        # Use Yarn 4.3.0 to build your site
      - name: Enable Corepack and prepare Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.3.0 --activate

      - name: Install, build, and upload your site
        uses: withastro/action@v1
        with: 
          path: .
          node-version: 20
          package-manager: yarn@
          run: |
            corepack enable
            corepack prepare yarn@4.3.0 --activate
        # with:
        #   path: . # The root location of your Astro project inside the repository. (optional)
        #   node-version: 20 # The specific version of Node that should be used to build your site. Defaults to 18. (optional)
        #   package-manager: yarn # The Node package manager that should be used to install dependencies and build your site. Automatically detected based on your lockfile. (optional)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v1